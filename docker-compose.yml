version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding-card-db
    environment:
      POSTGRES_USER: weddinguser
      POSTGRES_PASSWORD: weddingpass
      POSTGRES_DB: weddingcard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddinguser"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-card-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://weddinguser:weddingpass@postgres:5432/weddingcard
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: your-super-secret-key-change-in-production
      EMAIL_FROM: noreply@yourwedding.com
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

volumes:
  postgres_data:
